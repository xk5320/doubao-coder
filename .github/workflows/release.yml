name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: extension/doubao-coder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile
        run: npm run compile
      - name: Package VSIX
        run: npx --yes @vscode/vsce package --allow-missing-repository
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extension/doubao-coder/*.vsix
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: extension/doubao-coder/*.vsix
          generate_release_notes: true
      - name: Publish to Marketplace
        shell: pwsh
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if (-not $env:VSCE_PAT) {
            Write-Host "未配置 VSCE_PAT，跳过 Marketplace 发布"
            exit 0
          }
          $vsix = Get-ChildItem *.vsix | Select-Object -First 1
          npx --yes @vscode/vsce publish --packagePath $vsix.FullName --allow-missing-repository